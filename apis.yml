aid: oracle-fusion
name: Oracle Fusion Cloud Applications
description: >-
  Oracle Fusion Cloud Applications represent a comprehensive suite of cloud-based enterprise resource planning (ERP),
  human capital management (HCM), customer experience (CX), supply chain management (SCM), and enterprise performance
  management (EPM) solutions. Oracle Fusion Cloud provides REST APIs across all application pillars, enabling
  programmatic access to business data and processes for integration, automation, and extension of cloud applications.
type: Index
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
