openapi: 3.2.0
info:
  title: Oracle Fusion Cloud Applications Oracle Fusion Cloud ERP…
  description: REST APIs for Oracle Fusion Cloud ERP, providing programmatic access to financials, procurement, project management, and risk management capabilities. The API supports viewing and managing financial data including general ledger, accounts payable, accounts receivable, fixed assets, cash management, expense reports, and ERP integrations.
  version: 11.13.18.05
  contact:
    name: Oracle Support
    url: https://support.oracle.com
    email: support@oracle.com
  license:
    name: Oracle Cloud Services Agreement
    url: https://www.oracle.com/corporate/contracts/cloud-services/
  termsOfService: https://www.oracle.com/corporate/contracts/cloud-services/
servers:
- url: https://{instance}.oraclecloud.com
  description: Oracle Fusion Cloud Instance
  variables:
    instance:
      default: servername
      description: Your Oracle Cloud instance identifier
security:
- bearerAuth: []
tags:
- name: Budgetary Control
  description: Budget transactions and validation
paths:
  /fscmRestApi/resources/11.13.18.05/budgetaryControlBudgetTransactions:
    get:
      operationId: listBudgetTransactions
      summary: Oracle Fusion Cloud Applications List budget transactions
      description: Retrieve budgetary control budget transactions and validation results.
      tags:
      - Budgetary Control
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/finder'
      responses:
        '200':
          description: Budget transactions retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BudgetTransaction'
                  count:
                    type: integer
                  hasMore:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createBudgetTransaction
      summary: Oracle Fusion Cloud Applications Create a budget transaction
      description: Create budget entries and perform budgetary control validation.
      tags:
      - Budgetary Control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetTransactionCreate'
      responses:
        '201':
          description: Budget transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    BudgetTransactionCreate:
      type: object
      required:
      - BudgetName
      - LedgerName
      - PeriodName
      - BudgetAmount
      - CurrencyCode
      properties:
        BudgetName:
          type: string
        ControlBudgetName:
          type: string
        LedgerName:
          type: string
        PeriodName:
          type: string
        BudgetAmount:
          type: number
          format: double
        CurrencyCode:
          type: string
    ErrorResponse:
      type: object
      properties:
        type:
          type: string
          description: Error type URI
        title:
          type: string
          description: Short error description
        detail:
          type: string
          description: Detailed error message
        o:errorCode:
          type: string
          description: Oracle-specific error code
        o:errorDetails:
          type: array
          items:
            type: object
            properties:
              detail:
                type: string
              o:errorCode:
                type: string
    BudgetTransaction:
      type: object
      properties:
        BudgetTransactionId:
          type: integer
          description: Budget transaction identifier
        BudgetName:
          type: string
          description: Budget name
        ControlBudgetName:
          type: string
          description: Control budget name
        LedgerName:
          type: string
          description: Ledger name
        PeriodName:
          type: string
          description: Accounting period
        BudgetAmount:
          type: number
          format: double
          description: Budget amount
        CurrencyCode:
          type: string
          description: Currency code
        Status:
          type: string
          description: Transaction status
  responses:
    BadRequest:
      description: Invalid request parameters or payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication credentials are missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    offset:
      name: offset
      in: query
      required: false
      description: Number of items to skip before returning results
      schema:
        type: integer
        default: 0
    limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return (default 25, max 500)
      schema:
        type: integer
        default: 25
        maximum: 500
    q:
      name: q
      in: query
      required: false
      description: 'Filter expression using Oracle REST query syntax. Example: InvoiceNumber=''INV-001'' or InvoiceAmount>1000'
      schema:
        type: string
    finder:
      name: finder
      in: query
      required: false
      description: Named finder to execute. Format is FinderName;param1=value1,param2=value2
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token or basic authentication. Oracle Fusion Cloud supports both OAuth 2.0 and HTTP Basic authentication for REST API access.
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with Oracle Fusion Cloud credentials
externalDocs:
  description: Oracle Fusion Cloud Financials REST API Documentation
  url: https://docs.oracle.com/en/cloud/saas/financials/26a/farfa/index.html
