openapi: 3.2.0
info:
  title: Oracle Fusion Cloud Applications Oracle Fusion EPM REST…
  description: REST APIs for Oracle Fusion Cloud Enterprise Performance Management, enabling integration with planning, budgeting, forecasting, financial consolidation, account reconciliation, tax reporting, and narrative reporting capabilities. The EPM REST APIs allow infrastructure consultants to integrate environments with Oracle EPM Cloud services.
  version: v1
  contact:
    name: Oracle Support
    url: https://support.oracle.com
    email: support@oracle.com
  license:
    name: Oracle Cloud Services Agreement
    url: https://www.oracle.com/corporate/contracts/cloud-services/
  termsOfService: https://www.oracle.com/corporate/contracts/cloud-services/
servers:
- url: https://{instance}.oraclecloud.com
  description: Oracle Fusion Cloud EPM Instance
  variables:
    instance:
      default: your-instance
      description: Your Oracle Cloud EPM instance identifier
security:
- basicAuth: []
tags:
- name: Migration
  description: Application migration and lifecycle management
paths:
  /interop/rest/v3/snapshots:
    get:
      operationId: listSnapshots
      summary: Oracle Fusion Cloud Applications List snapshots
      description: Retrieve a list of application snapshots available for migration and backup operations.
      tags:
      - Migration
      responses:
        '200':
          description: Snapshots retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Snapshot'
                  status:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /interop/rest/v3/snapshots/{snapshotName}:
    delete:
      operationId: deleteSnapshot
      summary: Oracle Fusion Cloud Applications Delete a snapshot
      description: Delete an application snapshot.
      tags:
      - Migration
      parameters:
      - name: snapshotName
        in: path
        required: true
        description: Snapshot name
        schema:
          type: string
      responses:
        '200':
          description: Snapshot deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    Snapshot:
      type: object
      properties:
        name:
          type: string
          description: Snapshot name
        type:
          type: string
          description: Snapshot type
          enum:
          - LCM
          - External
        size:
          type: integer
          description: Snapshot size in bytes
        lastModifiedTime:
          type: string
          format: date-time
          description: Last modified timestamp
  responses:
    NotFound:
      description: The requested resource was not found
    Unauthorized:
      description: Authentication credentials are missing or invalid
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with Oracle EPM Cloud credentials
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  description: Oracle Fusion Cloud EPM REST API Documentation
  url: https://docs.oracle.com/en/cloud/saas/enterprise-performance-management-common/prest/index.html
