openapi: 3.2.0
info:
  title: Oracle Fusion Cloud Applications Oracle Fusion EPM REST…
  description: REST APIs for Oracle Fusion Cloud Enterprise Performance Management, enabling integration with planning, budgeting, forecasting, financial consolidation, account reconciliation, tax reporting, and narrative reporting capabilities. The EPM REST APIs allow infrastructure consultants to integrate environments with Oracle EPM Cloud services.
  version: v1
  contact:
    name: Oracle Support
    url: https://support.oracle.com
    email: support@oracle.com
  license:
    name: Oracle Cloud Services Agreement
    url: https://www.oracle.com/corporate/contracts/cloud-services/
  termsOfService: https://www.oracle.com/corporate/contracts/cloud-services/
servers:
- url: https://{instance}.oraclecloud.com
  description: Oracle Fusion Cloud EPM Instance
  variables:
    instance:
      default: your-instance
      description: Your Oracle Cloud EPM instance identifier
security:
- basicAuth: []
tags:
- name: Data Management
  description: Data import, export, and integration operations
paths:
  /interop/rest/v3/files:
    get:
      operationId: listFiles
      summary: Oracle Fusion Cloud Applications List files
      description: Retrieve a list of files in the EPM inbox and outbox used for data import, export, and snapshot operations.
      tags:
      - Data Management
      responses:
        '200':
          description: Files retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/File'
                  status:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /interop/rest/v3/files/{fileName}:
    get:
      operationId: downloadFile
      summary: Oracle Fusion Cloud Applications Download a file
      description: Download a file from the EPM inbox or outbox.
      tags:
      - Data Management
      parameters:
      - name: fileName
        in: path
        required: true
        description: File name including path
        schema:
          type: string
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: uploadFile
      summary: Oracle Fusion Cloud Applications Upload a file
      description: Upload a file to the EPM inbox for data import operations.
      tags:
      - Data Management
      parameters:
      - name: fileName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: File uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  details:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteFile
      summary: Oracle Fusion Cloud Applications Delete a file
      description: Delete a file from the EPM inbox or outbox.
      tags:
      - Data Management
      parameters:
      - name: fileName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: File deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
    NotFound:
      description: The requested resource was not found
  schemas:
    File:
      type: object
      properties:
        name:
          type: string
          description: File name
        path:
          type: string
          description: File path
        size:
          type: integer
          description: File size in bytes
        lastModifiedTime:
          type: string
          format: date-time
          description: Last modified timestamp
        isDirectory:
          type: boolean
          description: Whether the entry is a directory
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with Oracle EPM Cloud credentials
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  description: Oracle Fusion Cloud EPM REST API Documentation
  url: https://docs.oracle.com/en/cloud/saas/enterprise-performance-management-common/prest/index.html
